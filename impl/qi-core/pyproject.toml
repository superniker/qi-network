[project]
name = "qinetwork-core"
version = "0.1.1"
description = "Qi Network Protocol Core — identity, Agent Card, messaging, peer store. GB/Z 185 compatible."
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qinetwork"]
