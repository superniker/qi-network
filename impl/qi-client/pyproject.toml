[project]
name = "qinetwork-client"
version = "0.1.1"
description = "Qi Network Client SDK — connect, publish, search, find. Cross-platform, zero dependencies."
authors = [
    {name = "Qi Network"},
]
requires-python = ">=3.10"
dependencies = [
    "qinetwork-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qi_client"]
