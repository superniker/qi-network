[project]
name = "qi-bootstrap"
version = "0.1.0"
description = "Qi Network Bootstrap — Kademlia DHT entry node, first-hop discovery"
requires-python = ">=3.10"
dependencies = [
    "qi-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qi_bootstrap"]
